name: Build Berea APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with: { node-version: '20' }

      - uses: actions/setup-java@v4
        with: { distribution: 'temurin', java-version: '17' }

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with: { packages: 'platform-tools' }

      - name: Install SDK packages
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Convert SVG to PNG
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y librsvg2-bin
          mkdir -p resources
          rsvg-convert -w 1024 -h 1024 resources/icon.svg -o resources/icon.png
          rsvg-convert -w 2732 -h 2732 resources/splash.svg -o resources/splash.png
          ls -lh resources/

      - name: Install npm dependencies
        run: npm install

      - name: Capacitor add android + sync
        run: |
          if [ ! -d "android" ]; then npx cap add android; fi
          npx cap sync android

      - name: Permisos de notificaciones (alarma exacta)
        run: |
          f=android/app/src/main/AndroidManifest.xml
          grep -q SCHEDULE_EXACT_ALARM "$f" || sed -i 's|<application|<uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />\n    <application|' "$f"
          grep -n uses-permission "$f"

      - name: Generate icons
        run: npx @capacitor/assets generate --android || true

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: berea-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
