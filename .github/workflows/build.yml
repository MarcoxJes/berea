name: Build Berea APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with: { node-version: '20' }

      - uses: actions/setup-java@v4
        with: { distribution: 'temurin', java-version: '17' }

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with: { packages: 'platform-tools' }

      - name: Install SDK packages
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Convert SVG to PNG
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y librsvg2-bin
          mkdir -p resources
          rsvg-convert -w 1024 -h 1024 resources/icon.svg -o resources/icon.png
          rsvg-convert -w 2732 -h 2732 resources/splash.svg -o resources/splash.png
          ls -lh resources/

      - name: Install npm dependencies
        run: npm install

      - name: Capacitor add android + sync
        run: |
          if [ ! -d "android" ]; then npx cap add android; fi
          npx cap sync android

      - name: Permisos de notificaciones (alarma exacta)
        run: |
          f=android/app/src/main/AndroidManifest.xml
          grep -q SCHEDULE_EXACT_ALARM "$f" || sed -i 's|<application|<uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />\n    <application|' "$f"
          grep -n uses-permission "$f"

      - name: Edge-to-edge, atajos del icono y predictive back
        run: |
          m=android/app/src/main
          f="$m/AndroidManifest.xml"
          mkdir -p "$m/res/xml" "$m/res/values"
          cat > "$m/res/values/berea_shortcuts.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
            <string name="berea_sc_versiculo">Versículo</string>
            <string name="berea_sc_versiculo_long">Abre el versículo de hoy</string>
            <string name="berea_sc_lector">Lector</string>
            <string name="berea_sc_lector_long">Continúa tu lectura</string>
            <string name="berea_sc_buscar">Buscar</string>
            <string name="berea_sc_buscar_long">Busca en toda la Biblia</string>
          </resources>
          EOF
          cat > "$m/res/xml/shortcuts.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <shortcuts xmlns:android="http://schemas.android.com/apk/res/android">
            <shortcut android:shortcutId="versiculo" android:enabled="true" android:icon="@mipmap/ic_launcher"
                      android:shortcutShortLabel="@string/berea_sc_versiculo" android:shortcutLongLabel="@string/berea_sc_versiculo_long">
              <intent android:action="android.intent.action.VIEW" android:data="capacitor://localhost/#/" />
            </shortcut>
            <shortcut android:shortcutId="lector" android:enabled="true" android:icon="@mipmap/ic_launcher"
                      android:shortcutShortLabel="@string/berea_sc_lector" android:shortcutLongLabel="@string/berea_sc_lector_long">
              <intent android:action="android.intent.action.VIEW" android:data="capacitor://localhost/#/biblia" />
            </shortcut>
            <shortcut android:shortcutId="buscar" android:enabled="true" android:icon="@mipmap/ic_launcher"
                      android:shortcutShortLabel="@string/berea_sc_buscar" android:shortcutLongLabel="@string/berea_sc_buscar_long">
              <intent android:action="android.intent.action.VIEW" android:data="capacitor://localhost/#/buscar" />
            </shortcut>
          </shortcuts>
          EOF
          if grep -q 'android.app.shortcuts' "$f"; then
            echo "atajos: ya inyectados"
          else
            sed -i 's|</application>|        <meta-data android:name="android.app.shortcuts" android:resource="@xml/shortcuts" />\n    </application>|' "$f"
          fi
          if grep -q 'android:theme="@style/AppTheme"' "$f"; then
            mkdir -p "$m/res/values" "$m/res/values-night"
            cat > "$m/res/values/berea_edge.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
            <style name="BereaEdge" parent="AppTheme">
              <item name="android:statusBarColor">@android:color/transparent</item>
              <item name="android:navigationBarColor">@android:color/transparent</item>
              <item name="android:windowLightNavigationBar">true</item>
            </style>
          </resources>
          EOF
            cat > "$m/res/values-night/berea_edge.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
            <style name="BereaEdge" parent="AppTheme">
              <item name="android:statusBarColor">@android:color/transparent</item>
              <item name="android:navigationBarColor">@android:color/transparent</item>
              <item name="android:windowLightNavigationBar">false</item>
            </style>
          </resources>
          EOF
            sed -i 's|android:theme="@style/AppTheme"|android:theme="@style/BereaEdge"\n        android:enableOnBackInvokedCallback="true"|' "$f"
          else
            echo "AVISO: no se encontro android:theme=\"@style/AppTheme\"; edge-to-edge omitido"
          fi
          echo "== manifest =="
          grep -n 'BereaEdge\|enableOnBackInvokedCallback\|app.shortcuts' "$f"
          echo "== recursos =="
          find "$m/res" -name 'berea_edge.xml' -o -name 'shortcuts.xml'

      - name: Generate icons
        run: |
          npx @capacitor/assets generate --android || echo "AVISO: @capacitor/assets generate falló; se conservan los iconos por defecto"
          echo "== recursos generados =="
          find android/app/src/main/res -name 'splash.png'
          find android/app/src/main/res -name 'ic_launcher*.png'
          find android/app/src/main/res -name 'splash.png' -print -quit | grep -q . || { echo "FALTA splash.png"; exit 1; }
          find android/app/src/main/res -name 'ic_launcher*.png' -print -quit | grep -q . || { echo "FALTA ic_launcher"; exit 1; }

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: berea-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
