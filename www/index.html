<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1d4ed8">
<meta name="description" content="Study Berea — Biblioteca bíblica personal">
<title>Study Berea</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 6.5C10.5 5 8.5 4.3 6 4.3c-1 0-1.8.1-2.5.3v14c.7-.2 1.5-.3 2.5-.3 2.5 0 4.5.7 6 2.2 1.5-1.5 3.5-2.2 6-2.2 1 0 1.8.1 2.5.3v-14c-.7-.2-1.5-.3-2.5-.3-2.5 0-4.5.7-6 2.2z"/>
          <path d="M12 6.5v14"/>
        </svg>
      </div>
      <div class="brand-txt"><b>Study Berea</b><span>Biblioteca bíblica</span></div>
    </div>
    <nav class="nav" id="sideNav"></nav>
    <div class="side-foot">
      <button class="nav-item" data-go="#/ajustes">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6h.09A1.65 1.65 0 0 0 10.6 3.09V3a2 2 0 1 1 4 0v.09A1.65 1.65 0 0 0 16.11 4.6h.09a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 20.4 9v.09a1.65 1.65 0 0 0 1.51 1.51H22a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        <span>Ajustes</span>
      </button>
    </div>
  </aside>
  <div class="main">
    <header class="topbar" id="topbar"></header>
    <div class="scroll" id="scroll">
      <div class="scroll-inner" id="view"></div>
    </div>
  </div>
</div>

<button class="zen-exit" id="zenExit" title="Salir del modo lectura">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
</button>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet">
  <div class="sheet-grip"></div>
  <div class="sheet-head" id="sheetHead"></div>
  <div class="sheet-body" id="sheetBody"></div>
</div>
<div class="sec-panel" id="panel">
  <div class="sheet-head" id="panelHead"></div>
  <div class="sheet-body" id="panelBody"></div>
</div>
<div class="toast-wrap" id="toasts"></div>
<div class="img-menu" id="imgMenu"></div>

<script src="app.js"></script>
</body>
</html>
