<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1d4ed8">
<meta name="description" content="Berea — Biblioteca bíblica personal.">
<title>Berea</title>
<style>
:root{
  --font-ui:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --font-read:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  --bg:#f4f6f9;--bg-elev:#ffffff;--bg-sunken:#eaeef4;--bg-hover:#eff3f9;
  --text:#0d1526;--text-2:#4a5668;--text-3:#8b95a6;
  --border:#e0e6ef;--border-soft:#edf1f6;--border-strong:#c8d2e0;
  --accent:#1d4ed8;--accent-2:#3b6ef0;--accent-soft:#e7eeff;--accent-text:#ffffff;
  --ok:#0f7a52;--warn:#a35a06;--danger:#c02a2a;
  --r-sm:10px;--r-md:14px;--r-lg:20px;--r-xl:28px;
  --sh-1:0 1px 2px rgba(13,21,38,.06),0 1px 3px rgba(13,21,38,.04);
  --sh-2:0 2px 6px rgba(13,21,38,.07),0 8px 24px rgba(13,21,38,.06);
  --sh-3:0 12px 40px rgba(13,21,38,.16),0 2px 8px rgba(13,21,38,.08);
  --ease:cubic-bezier(.22,.61,.36,1);--ease-out:cubic-bezier(.16,1,.3,1);
  --spring:cubic-bezier(.34,1.4,.5,1);--dur:.22s;
  --nav-h:62px;--side-w:248px;--read-w:40rem;
  --safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px);
}
[data-theme="dark"]{
  --bg:#0a0e15;--bg-elev:#121924;--bg-sunken:#0e141d;--bg-hover:#1a2331;
  --text:#e8edf5;--text-2:#a3b0c2;--text-3:#6b7889;
  --border:#202b3a;--border-soft:#1a2432;--border-strong:#2e3b4d;
  --accent:#5b8cff;--accent-2:#7ba4ff;--accent-soft:#16233c;--accent-text:#08111f;
  --ok:#3ecf94;--warn:#e0a24a;--danger:#ff7070;
  --sh-1:0 1px 2px rgba(0,0,0,.4);
  --sh-2:0 2px 8px rgba(0,0,0,.45),0 12px 32px rgba(0,0,0,.35);
  --sh-3:0 16px 48px rgba(0,0,0,.6);
}
*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html{height:100%;}
body{margin:0;height:100%;font-family:var(--font-ui);background:var(--bg);color:var(--text);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;}
button,input,textarea,select{font:inherit;color:inherit;}
button{background:none;border:0;cursor:pointer;padding:0;position:relative;}
a{color:var(--accent);text-decoration:none;}
::selection{background:color-mix(in srgb,var(--accent) 28%,transparent);}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px;}
svg{width:20px;height:20px;flex-shrink:0;display:inline-block;vertical-align:middle;}

/* ===== NATIVO 1: sin selección accidental ===== */
*{ -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; }
input,textarea,[contenteditable="true"]{ -webkit-user-select:text; user-select:text; -webkit-touch-callout:default; }

/* ===== NATIVO 2: sin scrollbars, sin pull-to-refresh ===== */
html,body{ overscroll-behavior:none; overflow:hidden; }
::-webkit-scrollbar{ display:none; width:0; height:0; }
*{ scrollbar-width:none; }

/* ===== NATIVO 3: sin delay táctil ===== */
button,.row,.card-tap,.chip,.act,.rel-chip,.book-item,.chap-cell,.icon-btn,.bn-item,.nav-item{touch-action:manipulation;}

/* ===== NATIVO 4: sin hover pegado en táctil ===== */
@media (hover:none){
  .row:hover,.nav-item:hover,.icon-btn:hover,.link-btn:hover,.tb:hover,.ver-item:hover,.book-item:hover,.chap-cell:hover{background:transparent!important;color:inherit!important;}
  .btn:hover{background:var(--bg-elev)!important;border-color:var(--border)!important;}
  .btn-primary:hover{background:var(--accent)!important;border-color:var(--accent)!important;}
  .card-tap:hover{box-shadow:var(--sh-1)!important;border-color:var(--border)!important;transform:none!important;}
  .rel-chip:hover{transform:none!important;}
  .chip-tap:hover{border-color:var(--border-soft)!important;}
  .row:hover .row-ic{transform:none!important;}
  .row:hover .row-x{transform:none!important;color:var(--text-3)!important;}
  .verses p:hover{background:transparent!important;}
  .verses p:hover::before{opacity:0!important;}
  .verses p:hover .vnum{color:var(--text-3)!important;}
  .btn:hover svg{transform:none!important;}
  .nav-item:hover svg{transform:none!important;}
}

/* ===== NATIVO 5: GPU en lo animado ===== */
.sheet,.sec-panel,.fab,.scrim,.toast{will-change:transform;transform:translateZ(0);}

/* ===== NATIVO 6: transiciones direccionales ===== */
@keyframes viewForward{from{opacity:0;transform:translateX(22px);}to{opacity:1;transform:none;}}
@keyframes viewBack{from{opacity:0;transform:translateX(-22px);}to{opacity:1;transform:none;}}
#view.forward{animation:viewForward .28s var(--ease-out);}
#view.back{animation:viewBack .28s var(--ease-out);}

@keyframes itemIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}
@keyframes popIn{0%{opacity:0;transform:scale(.94);}100%{opacity:1;transform:scale(1);}}
@keyframes toastIn{from{opacity:0;transform:translateY(14px) scale(.94);}to{opacity:1;transform:none;}}
@keyframes savePulse{0%{opacity:0;transform:scale(.6);}20%{opacity:1;transform:scale(1);}70%{opacity:1;}100%{opacity:0;}}
@keyframes highlightPulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 45%,transparent);}100%{box-shadow:0 0 0 14px transparent;}}
@keyframes heroShift{0%,100%{background-position:0% 50%;}50%{background-position:100% 50%;}}
@keyframes liveBreath{0%,100%{opacity:.35;transform:scale(.85);}50%{opacity:1;transform:scale(1.15);}}
@keyframes fabRipple{0%{transform:scale(.9);opacity:.65;}100%{transform:scale(1.55);opacity:0;}}

.list>*,.stat-grid>*,.act-grid>*{animation:itemIn .38s var(--ease-out) backwards;}
.list>*:nth-child(1),.stat-grid>*:nth-child(1),.act-grid>*:nth-child(1){animation-delay:0ms;}
.list>*:nth-child(2),.stat-grid>*:nth-child(2),.act-grid>*:nth-child(2){animation-delay:24ms;}
.list>*:nth-child(3),.stat-grid>*:nth-child(3),.act-grid>*:nth-child(3){animation-delay:48ms;}
.list>*:nth-child(4),.stat-grid>*:nth-child(4),.act-grid>*:nth-child(4){animation-delay:72ms;}
.list>*:nth-child(5),.stat-grid>*:nth-child(5),.act-grid>*:nth-child(5){animation-delay:96ms;}
.list>*:nth-child(6),.stat-grid>*:nth-child(6),.act-grid>*:nth-child(6){animation-delay:120ms;}
.list>*:nth-child(n+7),.stat-grid>*:nth-child(n+7),.act-grid>*:nth-child(n+7){animation-delay:144ms;}

#app{display:flex;height:100dvh;overflow:hidden;}
.sidebar{width:var(--side-w);flex:0 0 var(--side-w);background:var(--bg-elev);border-right:1px solid var(--border);display:none;flex-direction:column;padding:18px 12px 12px;padding-top:calc(18px + var(--safe-t));}
.brand{display:flex;align-items:center;gap:11px;padding:4px 10px 20px;}
.brand-mark{width:34px;height:34px;border-radius:10px;flex:0 0 34px;background:linear-gradient(150deg,var(--accent),#6a3df0);display:grid;place-items:center;color:#fff;box-shadow:0 4px 14px color-mix(in srgb,var(--accent) 40%,transparent);transition:transform .4s var(--spring);}
.brand-mark svg{width:19px;height:19px;}
.brand-txt{display:flex;flex-direction:column;line-height:1.15;}
.brand-txt b{font-size:15.5px;letter-spacing:-.015em;font-weight:700;}
.brand-txt span{font-size:10.5px;color:var(--text-3);letter-spacing:.06em;text-transform:uppercase;font-weight:600;}
.nav{display:flex;flex-direction:column;gap:2px;}
.nav-item{display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:var(--r-sm);color:var(--text-2);font-size:14px;font-weight:500;transition:background var(--dur),color var(--dur),transform .12s;text-align:left;width:100%;}
.nav-item svg{width:18px;height:18px;flex:0 0 18px;opacity:.85;transition:transform .25s var(--spring);}
.nav-item.active{background:var(--accent-soft);color:var(--accent);font-weight:600;}
.nav-badge{margin-left:auto;font-size:11px;font-weight:700;background:var(--accent);color:var(--accent-text);border-radius:20px;padding:1px 7px;min-width:20px;text-align:center;}
.side-foot{margin-top:auto;padding:10px 4px 4px;}
.main{flex:1;display:flex;flex-direction:column;min-width:0;position:relative;}
.topbar{height:calc(52px + var(--safe-t));padding-top:var(--safe-t);display:flex;align-items:center;gap:8px;padding-inline:8px;border-bottom:1px solid var(--border-soft);background:color-mix(in srgb,var(--bg-elev) 90%,transparent);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);position:sticky;top:0;z-index:40;}
.topbar-title{font-size:15px;font-weight:650;letter-spacing:-.01em;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-inline:6px;}
.save-dot{width:7px;height:7px;border-radius:50%;background:var(--ok);opacity:0;flex:0 0 7px;margin-right:4px;}
.save-dot.on{animation:savePulse 1.6s var(--ease-out) forwards;}
.icon-btn{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;color:var(--text-2);transition:background var(--dur),color var(--dur),transform .12s;flex:0 0 auto;}
.icon-btn svg{width:19px;height:19px;}
.icon-btn:active{transform:scale(.9);}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;}
.scroll-inner{padding-bottom:calc(var(--nav-h) + var(--safe-b) + 32px);}
.bottomnav{position:fixed;left:0;right:0;bottom:0;z-index:50;height:calc(var(--nav-h) + var(--safe-b));padding-bottom:var(--safe-b);display:flex;align-items:stretch;background:color-mix(in srgb,var(--bg-elev) 92%,transparent);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid var(--border);}
.bn-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--text-3);font-size:10.5px;font-weight:600;transition:color var(--dur);position:relative;}
.bn-item svg{width:21px;height:21px;transition:transform .28s var(--spring);}
.bn-item.active{color:var(--accent);}
.bn-item.active svg{transform:translateY(-2px) scale(1.08);}
.bn-item:active svg{transform:scale(.85);}
@media (min-width:900px){.sidebar{display:flex;}.bottomnav{display:none;}.scroll-inner{padding-bottom:64px;}.topbar{padding-inline:22px;}}

.page{max-width:var(--read-w);margin:0 auto;padding:22px 20px 0;}
.page-wide{max-width:74rem;margin:0 auto;padding:22px 20px 0;}
.h1{font-size:27px;font-weight:730;letter-spacing:-.028em;margin:0 0 4px;line-height:1.15;}
.h2{font-size:18px;font-weight:680;letter-spacing:-.02em;margin:0;}
.h3{font-size:14.5px;font-weight:650;margin:0;}
.sub{font-size:13.5px;color:var(--text-2);margin:0;}
.tiny{font-size:12px;color:var(--text-3);}
.mono{font-variant-numeric:tabular-nums;}
.section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:30px 0 12px;}
.section-head:first-child{margin-top:6px;}
.link-btn{font-size:13px;font-weight:600;color:var(--accent);padding:4px 6px;border-radius:8px;display:inline-flex;align-items:center;gap:5px;}
.link-btn svg{width:14px;height:14px;}
.card{background:var(--bg-elev);border:1px solid var(--border);border-radius:var(--r-md);padding:16px;box-shadow:var(--sh-1);}
.card-tap{transition:transform .18s var(--spring),box-shadow var(--dur),border-color var(--dur);cursor:pointer;text-align:left;width:100%;display:block;}
.card-tap:active{transform:scale(.985);}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:9px 15px;border-radius:11px;font-size:13.5px;font-weight:600;background:var(--bg-elev);border:1px solid var(--border);color:var(--text);transition:background var(--dur),border-color var(--dur),transform .14s var(--spring),box-shadow var(--dur);white-space:nowrap;overflow:hidden;}
.btn svg{width:16px;height:16px;transition:transform .25s var(--spring);}
.btn:active{transform:scale(.96);}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--accent-text);box-shadow:0 2px 10px color-mix(in srgb,var(--accent) 28%,transparent);}
.btn-danger{color:var(--danger);}
.btn-sm{padding:6px 11px;font-size:12.5px;border-radius:9px;}
.btn-block{width:100%;}
.chip{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:20px;font-size:12px;font-weight:600;background:var(--bg-sunken);color:var(--text-2);border:1px solid var(--border-soft);transition:background var(--dur),color var(--dur),transform .14s var(--spring),border-color var(--dur);}
.chip svg{width:14px;height:14px;}
.chip.active{background:var(--accent);color:var(--accent-text);border-color:var(--accent);}
.chip-tap{cursor:pointer;}
.chip-tap:active{transform:scale(.94);}
.chip-row{display:flex;gap:7px;overflow-x:auto;padding:2px 0 4px;}
.tag{font-size:11px;font-weight:650;padding:2px 8px;border-radius:6px;background:var(--accent-soft);color:var(--accent);}
.tag-mut{background:var(--bg-sunken);color:var(--text-3);}
.empty{text-align:center;padding:56px 24px;color:var(--text-3);animation:itemIn .5s var(--ease-out);}
.empty svg{width:38px;height:38px;opacity:.35;margin-bottom:14px;animation:popIn .5s var(--spring);}
.empty p{margin:0 0 4px;font-size:14.5px;font-weight:600;color:var(--text-2);}
.empty small{font-size:13px;line-height:1.6;display:block;max-width:280px;margin:0 auto;}
.divider{height:1px;background:var(--border-soft);margin:22px 0;border:0;}
.reader{max-width:var(--read-w);margin:0 auto;padding:0 22px;}
.chapter-head{padding:26px 0 10px;}
.chapter-book{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin-bottom:6px;}
.chapter-title{font-size:32px;font-weight:730;letter-spacing:-.035em;margin:0;line-height:1.1;}
.chapter-meta{display:flex;align-items:center;gap:9px;margin-top:12px;flex-wrap:wrap;}
.ver-pill{font-size:11.5px;font-weight:650;color:var(--text-3);background:var(--bg-sunken);border-radius:20px;padding:3px 10px;}
.verses{font-family:var(--font-read);font-size:var(--read-size,19px);line-height:var(--read-lh,1.78);letter-spacing:.002em;}
.verses p{margin:0 0 .62em;padding:6px 10px 6px 22px;border-radius:9px;position:relative;transition:background .22s var(--ease);cursor:pointer;}
.verses p::before{content:"";position:absolute;left:6px;top:8px;bottom:8px;width:2px;background:var(--accent);opacity:0;border-radius:2px;transition:opacity .3s;}
.verses p.current::before{opacity:1;}
.verses p.sel{background:var(--accent-soft);}
.verses p.pulse{animation:highlightPulse .9s var(--ease-out);}
.verses p.hl-1{background:color-mix(in srgb,#ffe066 46%,transparent);}
.verses p.hl-2{background:color-mix(in srgb,#7ee0a8 42%,transparent);}
.verses p.hl-3{background:color-mix(in srgb,#8fc4ff 44%,transparent);}
.verses p.hl-4{background:color-mix(in srgb,#ffa8c4 40%,transparent);}
.verses p.hl-5{background:color-mix(in srgb,#c6a8ff 38%,transparent);}
[data-theme="dark"] .verses p.hl-1{background:color-mix(in srgb,#ffe066 17%,transparent);}
[data-theme="dark"] .verses p.hl-2{background:color-mix(in srgb,#7ee0a8 15%,transparent);}
[data-theme="dark"] .verses p.hl-3{background:color-mix(in srgb,#8fc4ff 17%,transparent);}
[data-theme="dark"] .verses p.hl-4{background:color-mix(in srgb,#ffa8c4 15%,transparent);}
[data-theme="dark"] .verses p.hl-5{background:color-mix(in srgb,#c6a8ff 15%,transparent);}
.vnum{font-family:var(--font-ui);font-size:.6em;font-weight:750;color:var(--text-3);vertical-align:.42em;margin-right:.5em;user-select:none;letter-spacing:.02em;}
.verses .w{border-radius:3px;transition:background .18s,color .18s;padding:0 1px;}
.verses .w.pressing{background:color-mix(in srgb,var(--accent) 22%,transparent);color:var(--accent);}
.verse-note-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--accent);margin-left:.55em;vertical-align:.15em;}
.verse-mark{position:absolute;right:8px;top:9px;color:var(--accent);opacity:.6;pointer-events:none;}
.verse-mark svg{width:12px;height:12px;}
.read-actions{display:flex;align-items:center;gap:10px;margin:34px 0 10px;}
.read-actions .btn{flex:1;}
.progress-ring{width:24px;height:24px;transform:rotate(-90deg);flex:0 0 24px;}
.progress-ring circle{fill:none;stroke-width:3;stroke-linecap:round;}
.progress-ring .bg{stroke:var(--border-strong);}
.progress-ring .fg{stroke:var(--accent);transition:stroke-dashoffset .35s var(--ease-out);}
.scrim{position:fixed;inset:0;background:rgba(6,10,18,.48);z-index:90;opacity:0;pointer-events:none;transition:opacity var(--dur);backdrop-filter:blur(3px);}
.scrim.on{opacity:1;pointer-events:auto;}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:95;background:var(--bg-elev);border-radius:var(--r-xl) var(--r-xl) 0 0;box-shadow:var(--sh-3);border:1px solid var(--border);border-bottom:0;transform:translateY(104%);transition:transform .42s var(--spring);max-height:88dvh;display:flex;flex-direction:column;padding-bottom:var(--safe-b);}
.sheet.on{transform:translateY(0);}
.sheet-grip{width:38px;height:4px;border-radius:4px;background:var(--border-strong);margin:9px auto 2px;flex:0 0 auto;}
.sheet-head{padding:10px 20px 12px;display:flex;align-items:flex-start;gap:12px;}
.sheet-head .h2{flex:1;}
.sheet-body{overflow-y:auto;padding:0 20px 20px;flex:1;}
.sheet-ref{font-size:12px;font-weight:700;color:var(--accent);letter-spacing:.05em;text-transform:uppercase;}
.sheet-quote{font-family:var(--font-read);font-size:16px;line-height:1.65;color:var(--text-2);background:var(--bg-sunken);border-radius:var(--r-sm);padding:12px 14px;margin:6px 0 16px;max-height:180px;overflow-y:auto;}
.act-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.act{display:flex;flex-direction:column;align-items:center;gap:7px;padding:13px 6px;border-radius:var(--r-sm);background:var(--bg-sunken);font-size:11.5px;font-weight:600;color:var(--text-2);text-align:center;transition:background var(--dur),transform .16s var(--spring),color var(--dur);}
.act svg{width:20px;height:20px;transition:transform .3s var(--spring);}
.act:active{transform:scale(.92);}
.act.on{background:var(--accent);color:var(--accent-text);}
.color-row{display:flex;gap:10px;padding:4px 0 2px;}
.color-dot{width:34px;height:34px;border-radius:50%;border:2px solid var(--border-strong);transition:transform .22s var(--spring),box-shadow var(--dur);}
.color-dot:active{transform:scale(.94);}
.color-dot.on{box-shadow:0 0 0 3px var(--bg-elev),0 0 0 5px var(--accent);}
.toast-wrap{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + var(--safe-b) + 16px);z-index:120;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;}
@media (min-width:900px){.toast-wrap{bottom:28px;}}
.toast{background:var(--text);color:var(--bg-elev);font-size:13px;font-weight:600;padding:10px 17px;border-radius:22px;box-shadow:var(--sh-3);animation:toastIn .32s var(--spring);display:flex;align-items:center;gap:9px;max-width:88vw;}
.toast svg{width:15px;height:15px;flex:0 0 15px;}
.field{margin-bottom:15px;}
.field label{display:block;font-size:12px;font-weight:700;color:var(--text-2);margin-bottom:6px;letter-spacing:.02em;}
.input,.textarea{width:100%;padding:10px 13px;border-radius:11px;background:var(--bg-sunken);border:1px solid var(--border);color:var(--text);font-size:14px;transition:border-color var(--dur),background var(--dur),box-shadow var(--dur);}
.input:focus,.textarea:focus{outline:none;border-color:var(--accent);background:var(--bg-elev);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 15%,transparent);}
.textarea{resize:vertical;min-height:90px;line-height:1.6;}
.editor-toolbar{position:sticky;top:0;z-index:20;display:flex;gap:2px;padding:6px 4px;margin:0 -4px 12px;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--border-soft);overflow-x:auto;}
.tb{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;color:var(--text-2);flex:0 0 34px;transition:background var(--dur),color var(--dur),transform .16s var(--spring);}
.tb svg{width:17px;height:17px;}
.tb:active{transform:scale(.9);}
.tb-sep{width:1px;background:var(--border);margin:6px 5px;flex:0 0 1px;}
.editor{min-height:44vh;font-size:15.5px;line-height:1.72;outline:none;color:var(--text);word-wrap:break-word;}
.editor:empty::before{content:attr(data-ph);color:var(--text-3);pointer-events:none;}
.editor h2{font-size:21px;font-weight:700;letter-spacing:-.022em;margin:1.3em 0 .45em;}
.editor h3{font-size:16.5px;font-weight:680;margin:1.2em 0 .4em;}
.editor p{margin:0 0 .8em;}
.editor ul,.editor ol{margin:0 0 .9em;padding-left:1.5em;}
.editor li{margin-bottom:.3em;}
.editor blockquote{margin:1em 0;padding:.55em 1em;border-left:3px solid var(--accent);background:var(--bg-sunken);border-radius:0 8px 8px 0;color:var(--text-2);font-style:italic;}
.editor hr{border:0;height:1px;background:var(--border);margin:1.6em 0;}
.editor img{max-width:100%;border-radius:10px;margin:.5em 0;}
.editor a{text-decoration:underline;}
.verse-embed{display:block;background:var(--bg-sunken);border-left:3px solid var(--accent);border-radius:0 10px 10px 0;padding:12px 15px;margin:1em 0;font-family:var(--font-read);font-size:15.5px;line-height:1.65;font-style:normal;animation:itemIn .35s var(--ease-out);}
.verse-embed .ve-ref{display:block;font-family:var(--font-ui);font-size:11px;font-weight:750;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);margin-bottom:6px;}
.row{display:flex;align-items:center;gap:13px;padding:13px 14px;border-radius:var(--r-sm);transition:background var(--dur),transform .16s var(--spring);width:100%;text-align:left;cursor:pointer;border:1px solid transparent;}
.row:active{transform:scale(.985);}
.row-ic{width:36px;height:36px;border-radius:10px;flex:0 0 36px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);transition:transform .25s var(--spring);}
.row-ic svg{width:18px;height:18px;}
.row-main{flex:1;min-width:0;}
.row-t{font-size:14px;font-weight:620;letter-spacing:-.008em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.row-s{font-size:12.5px;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px;}
.row-x{color:var(--text-3);flex:0 0 auto;width:16px;height:16px;transition:transform .25s var(--spring);}
.list{display:flex;flex-direction:column;gap:1px;}
.hero{background:linear-gradient(155deg,#1d4ed8 0%,#4a3ad6 40%,#6a3df0 70%,#1d4ed8 100%);background-size:220% 220%;animation:heroShift 28s var(--ease-in-out) infinite;border-radius:var(--r-lg);padding:24px 22px;color:#fff;position:relative;overflow:hidden;box-shadow:0 10px 34px color-mix(in srgb,var(--accent) 30%,transparent);}
.hero::after{content:"";position:absolute;right:-50px;top:-70px;width:210px;height:210px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.22),transparent 68%);animation:liveBreath 6s var(--ease-in-out) infinite;}
.hero::before{content:"";position:absolute;right:22px;bottom:-56px;width:140px;height:140px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.12),transparent 70%);}
.hero-lbl{font-size:10.5px;font-weight:750;letter-spacing:.11em;text-transform:uppercase;opacity:.82;position:relative;}
.hero-ref{font-size:23px;font-weight:730;letter-spacing:-.03em;margin:9px 0 4px;position:relative;}
.hero-txt{font-size:13.5px;opacity:.86;position:relative;}
.hero-btn{margin-top:16px;position:relative;display:inline-flex;align-items:center;gap:7px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.24);color:#fff;padding:8px 15px;border-radius:11px;font-size:13px;font-weight:650;backdrop-filter:blur(8px);}
.hero-btn svg{width:15px;height:15px;}
.vod-card{background:var(--bg-elev);border:1px solid var(--border);border-radius:var(--r-lg);padding:22px;box-shadow:var(--sh-1);position:relative;overflow:hidden;}
.vod-card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:linear-gradient(180deg,var(--accent),#6a3df0);}
.vod-ref{font-size:11px;font-weight:750;letter-spacing:.09em;text-transform:uppercase;color:var(--accent);}
.vod-text{font-family:var(--font-read);font-size:18px;line-height:1.68;margin:11px 0 0;letter-spacing:.002em;}
.vod-refl{font-size:14px;line-height:1.68;color:var(--text-2);margin:14px 0 0;}
.vod-actions{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap;}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;}
.stat{background:var(--bg-elev);border:1px solid var(--border);border-radius:var(--r-md);padding:15px;transition:transform .2s var(--spring),border-color var(--dur);}
.stat:active{transform:translateY(-1px);border-color:var(--border-strong);}
.stat-n{font-size:25px;font-weight:730;letter-spacing:-.035em;line-height:1;}
.stat-l{font-size:11.5px;color:var(--text-3);font-weight:600;margin-top:6px;}
.searchbar{display:flex;align-items:center;gap:10px;background:var(--bg-sunken);border:1px solid var(--border);border-radius:13px;padding:0 13px;height:44px;transition:border-color var(--dur),background var(--dur),box-shadow var(--dur);}
.searchbar:focus-within{border-color:var(--accent);background:var(--bg-elev);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 15%,transparent);}
.searchbar svg{width:18px;height:18px;color:var(--text-3);flex:0 0 18px;}
.searchbar input{flex:1;border:0;background:none;outline:none;font-size:14.5px;min-width:0;}
.searchbar input::placeholder{color:var(--text-3);}
.live-dot{width:6px;height:6px;border-radius:50%;background:var(--accent);flex:0 0 6px;animation:liveBreath 1.6s var(--ease-in-out) infinite;}
mark{background:color-mix(in srgb,var(--accent) 25%,transparent);color:inherit;border-radius:3px;padding:0 2px;}
.related-row{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;}
.rel-chip{flex:0 0 auto;display:flex;align-items:center;gap:7px;padding:8px 13px;border-radius:11px;background:var(--bg-sunken);border:1px solid var(--border-soft);font-size:12.5px;font-weight:600;color:var(--text-2);transition:border-color var(--dur),background var(--dur),color var(--dur),transform .16s var(--spring);cursor:pointer;white-space:nowrap;}
.rel-chip svg{width:14px;height:14px;}
.rel-chip:active{transform:scale(.96);}
.fab{position:fixed;right:18px;bottom:calc(var(--nav-h) + var(--safe-b) + 18px);z-index:45;width:54px;height:54px;border-radius:18px;background:var(--accent);color:var(--accent-text);display:grid;place-items:center;box-shadow:0 8px 26px color-mix(in srgb,var(--accent) 42%,transparent);transition:transform .2s var(--spring),background var(--dur),box-shadow var(--dur);}
.fab::before{content:"";position:absolute;inset:-8px;border-radius:inherit;border:2px solid color-mix(in srgb,var(--accent) 26%,transparent);animation:fabRipple 2.8s var(--ease-out) infinite;pointer-events:none;}
.fab svg{width:24px;height:24px;transition:transform .3s var(--spring);}
.fab:active{transform:scale(.9);}
@media (min-width:900px){.fab{bottom:28px;right:28px;}}
.sec-panel{position:fixed;top:0;right:0;bottom:0;width:390px;max-width:100vw;z-index:96;background:var(--bg-elev);border-left:1px solid var(--border);box-shadow:var(--sh-3);transform:translateX(104%);transition:transform .42s var(--spring);display:flex;flex-direction:column;}
.sec-panel.on{transform:translateX(0);}
@media (max-width:899px){.sec-panel{top:auto;left:0;right:0;bottom:0;width:auto;height:80dvh;border-left:0;border-top:1px solid var(--border);border-radius:var(--r-xl) var(--r-xl) 0 0;transform:translateY(104%);}.sec-panel.on{transform:translateY(0);}}
.ver-item{display:flex;align-items:center;gap:12px;padding:13px 14px;border-radius:var(--r-sm);cursor:pointer;transition:background var(--dur);}
.ver-item.on{background:var(--accent-soft);}
.book-item{padding:14px 16px;border-radius:var(--r-sm);cursor:pointer;font-size:14.5px;font-weight:600;display:flex;align-items:center;gap:10px;width:100%;text-align:left;transition:background var(--dur),transform .16s var(--spring);}
.book-item:active{transform:scale(.99);}
.chap-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(48px,1fr));gap:7px;}
.chap-cell{aspect-ratio:1;border-radius:11px;display:grid;place-items:center;background:var(--bg-sunken);border:1px solid var(--border-soft);font-size:13.5px;font-weight:650;color:var(--text-2);transition:background var(--dur),border-color var(--dur),color var(--dur),transform .16s var(--spring);}
.chap-cell:active{transform:scale(.9);}
.chap-cell.on{background:var(--accent);color:var(--accent-text);border-color:var(--accent);}
.chap-cell.na{opacity:.32;}
.autosave{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:var(--text-3);margin-top:18px;}
.autosave .dot{width:6px;height:6px;border-radius:50%;background:var(--border-strong);transition:background .3s;}
.autosave.saving .dot{background:var(--warn);animation:liveBreath 1s var(--ease-in-out) infinite;}
.autosave.saved .dot{background:var(--ok);}
.qc-input{width:100%;padding:14px 16px;font-size:16px;border-radius:14px;background:var(--bg-sunken);border:1px solid var(--border);color:var(--text);line-height:1.5;}
.qc-input:focus{outline:none;border-color:var(--accent);background:var(--bg-elev);}
.qc-hint{font-size:11.5px;color:var(--text-3);margin-top:10px;line-height:1.6;}
.qc-hint code{background:var(--bg-sunken);padding:1px 5px;border-radius:5px;font-size:11px;}
input[type=range]{-webkit-appearance:none;appearance:none;height:32px;background:transparent;width:100%;}
input[type=range]::-webkit-slider-runnable-track{height:4px;background:var(--border-strong);border-radius:4px;}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:var(--accent);margin-top:-8px;box-shadow:0 2px 8px color-mix(in srgb,var(--accent) 40%,transparent);}
</style>
</head>

const $ = (s,r)=>(r||document).querySelector(s);
const $$ = (s,r)=>Array.from((r||document).querySelectorAll(s));
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function stripTags(html){ const d=document.createElement('div'); d.innerHTML=html||''; return (d.textContent||'').replace(/\s+/g,' ').trim(); }
function norm(s){ return String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9ñ\s]/g,' ').replace(/\s+/g,' ').trim(); }
function lev(a,b,max){
  if(Math.abs(a.length-b.length)>(max||2)) return 99;
  const m=a.length,n=b.length; if(!m) return n; if(!n) return m;
  let prev=new Array(n+1); for(let j=0;j<=n;j++) prev[j]=j;
  for(let i=1;i<=m;i++){
    const cur=[i]; let best=i;
    for(let j=1;j<=n;j++){
      const cost=a[i-1]===b[j-1]?0:1;
      cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+cost);
      if(cur[j]<best) best=cur[j];
    }
    if(best>(max||2)) return 99;
    prev=cur;
  }
  return prev[n];
}
function fuzzyMatch(hay,needle){
  const h=norm(hay),n=norm(needle); if(!n) return false;
  if(h.includes(n)) return true;
  const hw=h.split(' '),nw=n.split(' ');
  return nw.every(tok=>hw.some(w=>w.startsWith(tok)||lev(w,tok,1)<=1));
}
function highlight(text,q){
  if(!q) return esc(text);
  const nq=norm(q); if(!nq) return esc(text);
  const tokens=nq.split(' ').filter(t=>t.length>1);
  if(!tokens.length) return esc(text);
  let out=esc(text);
  tokens.forEach(t=>{
    const re=new RegExp('('+t.split('').map(c=>c.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('[\\u0300-\\u036f]?')+')','gi');
    out=out.replace(re,'<mark>$1</mark>');
  });
  return out;
}
function fmtDate(ts){
  const d=new Date(ts),now=new Date(),diff=(now-d)/1000;
  if(diff<60) return 'ahora';
  if(diff<3600) return 'hace '+Math.floor(diff/60)+' min';
  if(diff<86400) return 'hace '+Math.floor(diff/3600)+' h';
  if(diff<604800) return 'hace '+Math.floor(diff/86400)+' d';
  return d.toLocaleDateString('es',{day:'numeric',month:'short',year:d.getFullYear()!==now.getFullYear()?'numeric':undefined});
}
function fmtFull(ts){ return new Date(ts).toLocaleString('es',{day:'numeric',month:'long',year:'numeric',hour:'2-digit',minute:'2-digit'}); }
function todayKey(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function debounce(fn,ms){ let t; return (...a)=>{ clearTimeout(t); t=setTimeout(()=>fn(...a),ms); }; }

async function copyText(t){
  try{
    if(navigator.clipboard && window.isSecureContext){ await navigator.clipboard.writeText(t); return; }
  }catch(e){}
  const ta=document.createElement('textarea'); ta.value=t; ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); }catch(e){}
  ta.remove();
}

async function download(name, content, mime){
  if(isNative && Cap.Filesystem){
    try{
      const base64 = btoa(unescape(encodeURIComponent(typeof content==='string'?content:'')));
      await Cap.Filesystem.writeFile({
        path: name,
        data: base64,
        directory: 'DOCUMENTS',
        recursive: true
      });
      toast('Guardado en Documentos','download');
      return;
    }catch(e){ console.warn('Filesystem',e); }
  }
  const blob=content instanceof Blob?content:new Blob([content],{type:mime||'text/plain;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url; a.download=name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),4000);
}

/* Store async nativo (Preferences) con fallback a localStorage */
const NativeStore = {
  async get(k){
    if(isNative && Cap.Preferences){
      try{
        const {value} = await Cap.Preferences.get({key: NS+k});
        if(value!==null && value!==undefined) return JSON.parse(value);
      }catch(e){}
    }
    try{ const v=localStorage.getItem(NS+k); return v!==null?JSON.parse(v):undefined; }catch(e){ return undefined; }
  },
  async set(k,v){
    if(isNative && Cap.Preferences){
      try{ await Cap.Preferences.set({key: NS+k, value: JSON.stringify(v)}); }catch(e){}
    }
    try{ localStorage.setItem(NS+k, JSON.stringify(v)); }catch(e){}
  },
  async del(k){
    if(isNative && Cap.Preferences){ try{ await Cap.Preferences.remove({key: NS+k}); }catch(e){} }
    try{ localStorage.removeItem(NS+k); }catch(e){}
  }
};

    3:["Había un hombre de los fariseos que se llamaba Nicodemo, un principal entre los judíos.","Este vino a Jesús de noche, y le dijo: Rabí, sabemos que has venido de Dios como maestro; porque nadie puede hacer estas señales que tú haces, si no está Dios con él.","Respondió Jesús y le dijo: De cierto, de cierto te digo, que el que no naciere de nuevo, no puede ver el reino de Dios.","Nicodemo le dijo: ¿Cómo puede un hombre nacer siendo viejo? ¿Puede acaso entrar por segunda vez en el vientre de su madre, y nacer?","Respondió Jesús: De cierto, de cierto te digo, que el que no naciere de agua y del Espíritu, no puede entrar en el reino de Dios.","Lo que es nacido de la carne, carne es; y lo que es nacido del Espíritu, espíritu es.","No te maravilles de que te dije: Os es necesario nacer de nuevo.","El viento sopla de donde quiere, y oyes su sonido; mas ni sabes de dónde viene, ni a dónde va; así es todo aquel que es nacido del Espíritu.","Respondió Nicodemo y le dijo: ¿Cómo puede hacerse esto?","Respondió Jesús y le dijo: ¿Eres tú maestro de Israel, y no sabes esto?","De cierto, de cierto te digo, que lo que sabemos hablamos, y lo que hemos visto, testificamos; y no recibís nuestro testimonio.","Si os he dicho cosas terrenales, y no creéis, ¿cómo creeréis si os dijere las celestiales?","Nadie subió al cielo, sino el que descendió del cielo; el Hijo del Hombre, que está en el cielo.","Y como Moisés levantó la serpiente en el desierto, así es necesario que el Hijo del Hombre sea levantado,","para que todo aquel que en él cree, no se pierda, mas tenga vida eterna.","Porque de tal manera amó Dios al mundo, que ha dado a su Hijo unigénito, para que todo aquel que en él cree, no se pierda, mas tenga vida eterna.","Porque no envió Dios a su Hijo al mundo para condenar al mundo, sino para que el mundo sea salvo por él.","El que en él cree, no es condenado; pero el que no cree, ya ha sido condenado, porque no ha creído en el nombre del unigénito Hijo de Dios.","Y esta es la condenación: que la luz vino al mundo, y los hombres amaron más las tinieblas que la luz, porque sus obras eran malas.","Porque todo aquel que hace lo malo, aborrece la luz y no viene a la luz, para que sus obras no sean reprendidas.","Mas el que practica la verdad viene a la luz, para que sea manifiesto que sus obras son hechas en Dios."]

  rom:{
    6:["¿Qué, pues, diremos? ¿Perseveraremos en el pecado para que la gracia abunde?","En ninguna manera. Porque los que hemos muerto al pecado, ¿cómo viviremos aún en él?","¿O no sabéis que todos los que hemos sido bautizados en Cristo Jesús, hemos sido bautizados en su muerte?","Porque somos sepultados juntamente con él para muerte por el bautismo, a fin de que como Cristo resucitó de los muertos por la gloria del Padre, así también nosotros andemos en vida nueva.","Porque si fuimos plantados juntamente con él en la semejanza de su muerte, así también lo seremos en la de su resurrección;","sabiendo esto, que nuestro viejo hombre fue crucificado juntamente con él, para que el cuerpo del pecado sea destruido, a fin de que no sirvamos más al pecado.","Porque el que ha muerto, ha sido justificado del pecado.","Y si morimos con Cristo, creemos que también viviremos con él;","sabiendo que Cristo, habiendo resucitado de los muertos, ya no muere; la muerte no se enseñorea más de él.","Porque en cuanto murió, al pecado murió una vez por todas; mas en cuanto vive, para Dios vive.","Así también vosotros consideraos muertos al pecado, pero vivos para Dios en Cristo Jesús, Señor nuestro.","No reine, pues, el pecado en vuestro cuerpo mortal, de modo que lo obedezcáis en sus concupiscencias;","ni tampoco presentéis vuestros miembros al pecado como instrumentos de iniquidad, sino presentaos vosotros mismos a Dios como vivos de entre los muertos, y vuestros miembros a Dios como instrumentos de justicia.","Porque el pecado no se enseñoreará de vosotros; pues no estáis bajo la ley, sino bajo la gracia.","¿Qué, pues? ¿Pecaremos, porque no estamos bajo la ley, sino bajo la gracia? En ninguna manera.","¿No sabéis que si os sometéis a alguien como esclavos para obedecerle, sois esclavos de aquel a quien obedecéis, sea del pecado para muerte, o sea de la obediencia para justicia?","Pero gracias a Dios, que aunque erais esclavos del pecado, habéis obedecido de corazón a aquella forma de doctrina a la cual fuisteis entregados;","y libertados del pecado, vinisteis a ser siervos de la justicia.","Hablo como humano, por vuestra humana debilidad; que así como para iniquidad presentasteis vuestros miembros para servir a la inmundicia y a la iniquidad, así ahora para santificación presentad vuestros miembros para servir a la justicia.","Porque cuando erais esclavos del pecado, erais libres acerca de la justicia.","¿Pero qué fruto teníais de aquellas cosas de las cuales ahora os avergonzáis? Porque el fin de ellas es muerte.","Mas ahora que habéis sido libertados del pecado y hechos siervos de Dios, tenéis por vuestro fruto la santificación, y como fin, la vida eterna.","Porque la paga del pecado es muerte, mas la dádiva de Dios es vida eterna en Cristo Jesús Señor nuestro."],
    8:["Ahora, pues, ninguna condenación hay para los que están en Cristo Jesús, los que no andan conforme a la carne, sino conforme al Espíritu.","Porque la ley del Espíritu de vida en Cristo Jesús me ha librado de la ley del pecado y de la muerte.","Porque lo que era imposible para la ley, por cuanto era débil por la carne, Dios, enviando a su Hijo en semejanza de carne de pecado y a causa del pecado, condenó al pecado en la carne;","para que la justicia de la ley se cumpliese en nosotros, que no andamos conforme a la carne, sino conforme al Espíritu.","Porque los que son de la carne piensan en las cosas de la carne; pero los que son del Espíritu, en las cosas del Espíritu.","Porque el ocuparse de la carne es muerte, pero el ocuparse del Espíritu es vida y paz.","Por cuanto los designios de la carne son enemistad contra Dios; porque no se sujetan a la ley de Dios, ni tampoco pueden;","y los que viven según la carne no pueden agradar a Dios.","Mas vosotros no vivís según la carne, sino según el Espíritu, si es que el Espíritu de Dios mora en vosotros. Y si alguno no tiene el Espíritu de Cristo, no es de él.","Pero si Cristo está en vosotros, el cuerpo en verdad está muerto a causa del pecado, mas el espíritu vive a causa de la justicia.","Y si el Espíritu de aquel que levantó de los muertos a Jesús mora en vosotros, el que levantó de los muertos a Cristo Jesús vivificará también vuestros cuerpos mortales por su Espíritu que mora en vosotros."]

function activeVersion(){
  const V = S.versions || [];
  return V.find(v=>v.id===S.settings.versionId) || V[0];
}
function getChapter(versionId, bookId, chapter){
  if(S.bible && S.bible[versionId] && S.bible[versionId][bookId] && S.bible[versionId][bookId][chapter]) return S.bible[versionId][bookId][chapter];
  if(versionId==='rv1909' && PD_TEXT[bookId] && PD_TEXT[bookId][chapter]) return PD_TEXT[bookId][chapter];
  return null;
}
function verseText(bookId, chapter, verse){
  const arr = getChapter(S.settings.versionId, bookId, chapter);
  return arr ? (arr[verse-1]||'') : '';
}
function refLabel(bookId, chapter, verse){
  const b = bookById(bookId);
  return b ? b.name+' '+chapter+(verse?':'+verse:'') : '';
}
function refShort(bookId, chapter, verse){
  const b = bookById(bookId);
  return b ? b.abbr+' '+chapter+(verse?':'+verse:'') : '';
}

  pushHistory(book, chapter, verse){
    S.history = S.history.filter(h=>!(h.book===book&&h.chapter===chapter));
    S.history.unshift({book,chapter,verse:verse||null,at:Date.now()});
    S.history = S.history.slice(0,60);
    S.settings.lastRead = {book,chapter,verse:verse||S.settings.lastRead.verse};
    save('settings'); save('history');
    const k=todayKey();
    if(!S.stats.days.includes(k)){ S.stats.days.push(k); S.stats.days=S.stats.days.slice(-60); save('stats'); }
  },
  streakDays(){
    const days=new Set(S.stats.days||[]); let n=0; const d=new Date();
    while(true){
      const k=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
      if(days.has(k)){ n++; d.setDate(d.getDate()-1); } else break;
    }
    return n;
  },
  highlightOf(b,c,v){ return S.highlights.find(h=>h.book===b&&h.chapter===c&&h.verse===v); },
  toggleHighlight(b,c,v,color){
    const ex=S.highlights.find(h=>h.book===b&&h.chapter===c&&h.verse===v);
    if(ex && (!color || ex.color===color)){ S.highlights=S.highlights.filter(h=>h!==ex); save('highlights'); return null; }
    if(ex){ ex.color=color; ex.updatedAt=Date.now(); }
    else S.highlights.push({id:uid(),book:b,chapter:c,verse:v,color:color||'1',createdAt:Date.now(),updatedAt:Date.now()});
    save('highlights'); return true;
  },
  isFavorite(type,ref){ return S.favorites.some(f=>f.type===type&&f.ref===ref); },
  toggleFavorite(type,ref,label){
    const i=S.favorites.findIndex(f=>f.type===type&&f.ref===ref);
    if(i>=0){ S.favorites.splice(i,1); save('favorites'); return false; }
    S.favorites.unshift({id:uid(),type,ref,label:label||ref,createdAt:Date.now()});
    save('favorites'); return true;
  },
  isBookmark(ref){ return S.bookmarks.some(b=>b.ref===ref); },
  toggleBookmark(ref,label,extra){
    const i=S.bookmarks.findIndex(b=>b.ref===ref);
    if(i>=0){ S.bookmarks.splice(i,1); save('bookmarks'); return false; }
    S.bookmarks.unshift({id:uid(),ref,label:label||ref,...(extra||{}),createdAt:Date.now()});
    save('bookmarks'); return true;
  },
  addInbox(item){ S.inbox.unshift({id:uid(),done:false,createdAt:Date.now(),...item}); save('inbox'); },
  removeInbox(id){ S.inbox=S.inbox.filter(i=>i.id!==id); save('inbox'); },
  createNote(data){
    const n={id:uid(),title:'',content:'',tags:[],folderId:null,status:'',favorite:false,deletedAt:null,refs:[],links:[],createdAt:Date.now(),updatedAt:Date.now(),...(data||{})};
    S.notes.unshift(n); save('notes'); return n;
  },
  getNote(id){ return S.notes.find(n=>n.id===id); },
  trashNote(id){ const n=S.notes.find(x=>x.id===id); if(n){ n.deletedAt=Date.now(); save('notes'); } },
  restoreNote(id){ const n=S.notes.find(x=>x.id===id); if(n){ n.deletedAt=null; save('notes'); } },
  createStudy(data){
    const s={id:uid(),title:'',blocks:[],tags:[],folderId:null,status:'',favorite:false,deletedAt:null,refs:[],createdAt:Date.now(),updatedAt:Date.now(),...(data||{})};
    S.studies.unshift(s); save('studies'); return s;
  },
  getStudy(id){ return S.studies.find(s=>s.id===id); },
  trashStudy(id){ const s=S.studies.find(x=>x.id===id); if(s){ s.deletedAt=Date.now(); save('studies'); } },
  restoreStudy(id){ const s=S.studies.find(x=>x.id===id); if(s){ s.deletedAt=null; save('studies'); } },
  relate(a,b,label){
    const key=[a.type,a.id,b.type,b.id].join('|');
    const keyR=[b.type,b.id,a.type,a.id].join('|');
    if(S.relations.some(r=>r.key===key||r.key===keyR)) return null;
    const rel={id:uid(),key,a,b,label:label||'',createdAt:Date.now()};
    S.relations.push(rel); save('relations'); return rel;
  },
  relationsOf(type,id){
    return S.relations.filter(r=>(r.a.type===type&&r.a.id===id)||(r.b.type===type&&r.b.id===id))
      .map(r=>(r.a.type===type&&r.a.id===id)?r.b:r.a);
  },
  createFolder(name){ const f={id:uid(),name,createdAt:Date.now()}; S.folders.push(f); save('folders'); return f; },
  deleteFolder(id){
    S.folders=S.folders.filter(f=>f.id!==id);
    S.notes.forEach(n=>{ if(n.folderId===id) n.folderId=null; });
    S.studies.forEach(s=>{ if(s.folderId===id) s.folderId=null; });
    save('folders'); save('notes'); save('studies');
  },
  vodForDate(key){
    if(!S.vod.length) return null;
    let hash=0; for(let i=0;i<key.length;i++) hash=(hash*31+key.charCodeAt(i))>>>0;
    return S.vod[hash%S.vod.length];
  }
};

function toast(msg, icon){
  const el=document.createElement('div');
  el.className='toast';
  el.innerHTML=(icon?ic(icon):'')+'<span>'+esc(msg)+'</span>';
  $('#toasts').appendChild(el);
  setTimeout(()=>{
    el.style.transition='opacity .3s, transform .3s';
    el.style.opacity='0'; el.style.transform='translateY(10px)';
    setTimeout(()=>el.remove(),320);
  },2100);
}

const Layers = {
  openSheet(build){
    const sh=$('#sheet'),sc=$('#scrim');
    $('#sheetHead').innerHTML='';
    $('#sheetBody').innerHTML='';
    build($('#sheetHead'),$('#sheetBody'));
    sh.classList.add('on'); sc.classList.add('on');
    haptic('light');
  },
  closeSheet(){
    $('#sheet').classList.remove('on');
    if(!$('#panel').classList.contains('on')) $('#scrim').classList.remove('on');
  },
  closeAll(){ Layers.closeSheet(); $('#panel').classList.remove('on'); $('#scrim').classList.remove('on'); }
};

function askText({title,label,value,placeholder,multiline,confirmText}){
  return new Promise(resolve=>{
    Layers.openSheet((head,body)=>{
      head.innerHTML='<div class="h2" style="flex:1">'+esc(title)+'</div><button class="icon-btn" data-cancel>'+ic('close')+'</button>';
      body.innerHTML=
        (label?'<div class="field"><label>'+esc(label)+'</label>':'<div class="field">')+
        (multiline?'<textarea class="textarea" id="askInput" placeholder="'+esc(placeholder||'')+'">'+esc(value||'')+'</textarea>':'<input class="input" id="askInput" value="'+esc(value||'')+'" placeholder="'+esc(placeholder||'')+'">')+
        '</div><button class="btn btn-primary btn-block" id="askOk">'+esc(confirmText||'Guardar')+'</button>';
      const input=$('#askInput',body);
      setTimeout(()=>{ input.focus(); if(!multiline) input.select(); },120);
      const done=v=>{ Layers.closeSheet(); resolve(v); };
      $('#askOk',body).onclick=()=>done(input.value.trim());
      head.querySelector('[data-cancel]').onclick=()=>done(null);
      input.addEventListener('keydown',e=>{ if(e.key==='Enter'&&!multiline){ e.preventDefault(); done(input.value.trim()); } });
    });
  });
}

async function confirmDialog(title, message, confirmText){

    try{
      const {value} = await Cap.Dialog.confirm({ title, message, okButtonTitle: confirmText||'Confirmar', cancelButtonTitle:'Cancelar' });

function currentRoute(){
  let h=location.hash.replace(/^#/,'')||'/';
  h=h.split('?')[0];
  return h.split('/').filter(Boolean);
}
function go(hash){ location.hash=hash; }
function isActive(href){
  const cur=(location.hash||'#/').split('?')[0];
  if(href==='#/') return cur==='#/'||cur==='';
  return cur.startsWith(href);
}
function renderNav(){
  $('#sideNav').innerHTML=NAV_SIDE.map(n=>
    '<button class="nav-item '+(isActive(n.href)?'active':'')+'" data-go="'+n.href+'">'+
    ic(n.icon)+'<span>'+n.label+'</span>'+
    (n.href==='#/inbox'&&S.inbox.filter(i=>!i.done).length?'<span class="nav-badge">'+S.inbox.filter(i=>!i.done).length+'</span>':'')+
    '</button>').join('');
  document.querySelectorAll('[data-go]').forEach(el=>{
    if(el.__bound) return; el.__bound=true;
    el.addEventListener('click',()=>{ haptic('light'); go(el.dataset.go); });
  });
}
function mountBottomNav(){
  if($('#bottomnav')) return;
  const el=document.createElement('nav');

  el.innerHTML=NAV_MAIN.map(n=>'<button class="bn-item" data-go="'+n.href+'">'+ic(n.icon)+'<span>'+n.label+'</span></button>').join('');

function openQuickCapture(){
  Layers.openSheet((h,b)=>{
    h.innerHTML='<div class="h2" style="flex:1">Captura rápida</div><button class="icon-btn" data-close>'+ic('close')+'</button>';
    b.innerHTML=
      '<div class="field"><textarea class="qc-input" id="qci" rows="3" placeholder="Una idea, una referencia (Juan 3:16), una palabra…"></textarea></div>'+
      '<button class="btn btn-primary btn-block" style="margin-bottom:14px" id="qcok">'+ic('inbox')+' Guardar en «Para estudiar después»</button>'+
      '<p class="qc-hint">Escribe una referencia como <code>Romanos 6:4</code> y se guardará como versículo.</p>';
    const inp=$('#qci',b);
    setTimeout(()=>inp.focus(),120);
    h.querySelector('[data-close]').onclick=()=>Layers.closeSheet();
    const commit=()=>{
      const v=inp.value.trim(); if(!v) return;
      const parsed=parseRef(v);
      if(parsed && parsed.verse){
        Data.addInbox({kind:'verse',title:refLabel(parsed.book,parsed.chapter,parsed.verse),subtitle:'Referencia',book:parsed.book,chapter:parsed.chapter,verse:parsed.verse,text:verseText(parsed.book,parsed.chapter,parsed.verse)});
      } else if(parsed){
        Data.addInbox({kind:'verse',title:refLabel(parsed.book,parsed.chapter),subtitle:'Capítulo',book:parsed.book,chapter:parsed.chapter});
      } else {
        Data.addInbox({kind:'note',title:v,subtitle:'Idea rápida'});
      }
      haptic('success'); Layers.closeSheet(); toast('Guardado','inbox'); flashSave(); renderNav();
    };
    $('#qcok',b).onclick=commit;
    inp.addEventListener('keydown',e=>{ if(e.key==='Enter'&&(e.metaKey||e.ctrlKey)){ e.preventDefault(); commit(); } });
  });
}

const View = {};

function setTopbar({back,title,actions,progress}){
  $('#topbar').innerHTML=
    (back?'<button class="icon-btn" id="tbBack">'+ic('back')+'</button>':'')+
    '<div class="topbar-title">'+(title||'')+'</div>'+
    '<div class="save-dot" id="saveDot"></div>'+
    (progress?progressRing(progress):'')+
    (actions||[]).map((a,i)=>'<button class="icon-btn" data-act="'+i+'" title="'+esc(a.title||'')+'">'+ic(a.icon)+'</button>').join('');
  if(back) $('#tbBack').onclick=()=>{ haptic('light'); history.length>1?history.back():go('#/'); };
  (actions||[]).forEach((a,i)=>{
    const el=$('#topbar').querySelector('[data-act="'+i+'"]');
    if(el) el.onclick=()=>{ haptic('light'); a.onClick(); };
  });
}
function progressRing(pct){
  const r=9,c=2*Math.PI*r,off=c*(1-Math.max(0,Math.min(1,pct)));
  return '<svg class="progress-ring" viewBox="0 0 24 24"><circle class="bg" cx="12" cy="12" r="'+r+'"></circle>'+
    '<circle class="fg" cx="12" cy="12" r="'+r+'" stroke-dasharray="'+c.toFixed(2)+'" stroke-dashoffset="'+off.toFixed(2)+'"></circle></svg>';
}

let _lastDepth=0;
function render(){
  const r=currentRoute();
  const seg0=r[0]||'';
  const view=$('#view');
  const depth=r.length;
  view.classList.remove('forward','back');
  if(depth>_lastDepth) view.classList.add('forward');
  else if(depth<_lastDepth) view.classList.add('back');
  _lastDepth=depth;
  window.scrollTo(0,0);
  $('#scroll').scrollTop=0;

  const map={
    '':View.home,'biblia':View.bible,'explorar':View.explore,'doctrina':View.doctrine,
    'estudios':View.studies,'notas':View.notes,'inbox':View.inbox,'favoritos':View.favorites,
    'buscar':View.search,'panel':View.admin,'ajustes':View.settings,'mas':View.more,
    'leer':View.read,'estudio':View.study,'nota':View.note,'palabra':View.word,
    'entrada':View.exploreEntry,'compartido':View.shared
  };

  if(seg0==='doctrina' && r.length>1) View.doctrineEntry(view,r);
  else if(seg0==='admin' && r.length>1){
    if(r[1]==='versiones') View.adminVersions(view,r);
    else View.adminList(view,r);
  } else {
    const fn=map[seg0];
    if(fn) fn(view,r);
    else view.innerHTML='<div class="page"><div class="empty">'+ic('info')+'<p>Página no encontrada</p><small>Ruta: <code>'+esc(location.hash||'#/')+'</code></small></div></div>';
  }
  renderNav();
  syncBottomNav();
}

function toggleTheme(){
  const cur=document.documentElement.dataset.theme;
  const next=cur==='dark'?'light':'dark';
  haptic('light'); applyTheme(next); S.settings.theme=next; save('settings'); render();
}
function applyTheme(t){
  let mode=t;
  if(t==='auto') mode=window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';
  document.documentElement.dataset.theme=mode;
  const meta=document.querySelector('meta[name="theme-color"]');
  if(meta) meta.setAttribute('content',mode==='dark'?'#0a0e15':'#1d4ed8');
  if(isNative && Cap.StatusBar){
    try{
      Cap.StatusBar.setStyle({style: mode==='dark'?'DARK':'LIGHT'});
      Cap.StatusBar.setBackgroundColor({color: mode==='dark'?'#0a0e15':'#f4f6f9'});
    }catch(e){}
  }
}

function parseRef(q){
  if(!q) return null;
  const s=q.trim();
  const m=s.match(/^(.+?)\s+(\d+)(?:\s*[:.\s]\s*(\d+))?$/);
  if(!m){ const b=bookByName(s); return b?{book:b.id,chapter:1}:null; }
  const b=bookByName(m[1]); if(!b) return null;
  const ch=Math.min(Math.max(1,parseInt(m[2],10)),b.chapters);
  return {book:b.id,chapter:ch,verse:m[3]?parseInt(m[3],10):null};
}

}

    el.innerHTML='<div class="reader"><div class="chapter-head"><div class="chapter-book">'+esc(b.name)+'</div><h1 class="chapter-title">Capítulo '+chapter+'</h1></div>'+

  }
  const notesByVerse={};
  S.notes.filter(n=>!n.deletedAt).forEach(n=>{ (n.refs||[]).forEach(r=>{ if(r.book===bookId&&r.chapter===chapter&&r.verse) notesByVerse[r.verse]=n.id; }); });
  const marksByVerse={};
  S.bookmarks.forEach(bm=>{ const m=(bm.ref||'').match(/^(\w+)\.(\d+)\.(\d+)$/); if(m&&m[1]===bookId&&+m[2]===chapter) marksByVerse[+m[3]]=true; });

  el.innerHTML='<div class="reader">'+
    '<div class="chapter-head"><div class="chapter-book">'+esc(b.name)+'</div><h1 class="chapter-title">Capítulo '+chapter+'</h1>'+
    '<div class="chapter-meta"><span class="ver-pill">'+esc(ver.abbr)+'</span><span class="ver-pill">'+text.length+' versículos'+(ver.sample?' · muestra':'')+'</span></div></div>'+
    '<div class="verses" id="verses">'+text.map((t,i)=>{
      const vn=i+1; const hl=Data.highlightOf(bookId,chapter,vn);
      const hasNote=notesByVerse[vn]; const hasMark=marksByVerse[vn];
      return '<p data-v="'+vn+'" class="'+(hl?'hl-'+hl.color:'')+'" id="v'+vn+'">'+
        '<span class="vnum">'+vn+'</span>'+verseToSpans(t)+
        (hasNote?'<span class="verse-note-dot"></span>':'')+
        (hasMark?'<span class="verse-mark">'+ic('bookmark')+'</span>':'')+'</p>';
    }).join('')+'</div>'+
    '<div class="read-actions">'+
      (chapter>1?'<button class="btn" data-prev>'+ic('back')+' Cap. '+(chapter-1)+'</button>':'')+
      (chapter<b.chapters?'<button class="btn btn-primary" data-next>Cap. '+(chapter+1)+' '+ic('fwd')+'</button>':'')+
    '</div>'+
    '<div class="divider"></div>'+
    '<div class="section-head" style="margin-top:0"><div class="h2">En este capítulo</div></div>'+
    '<div class="related-row" id="chapterRelated"></div>'+
    '<div class="section-head"><div class="h2">Relacionado</div></div>'+
    '<div id="relBlock"></div><div style="height:24px"></div></div>';

  Data.pushHistory(bookId,chapter,S.settings.lastRead.verse);
  const p=$('[data-prev]',el); if(p) p.onclick=()=>go('#/leer/'+bookId+'/'+(chapter-1));
  const n=$('[data-next]',el); if(n) n.onclick=()=>go('#/leer/'+bookId+'/'+(chapter+1));

  el.querySelectorAll('#verses p').forEach(pp=>{
    let pressTimer=null, didLong=false;
    const clear=()=>{ if(pressTimer){ clearTimeout(pressTimer); pressTimer=null; } };
    pp.addEventListener('pointerdown',e=>{
      didLong=false;
      const target=e.target.closest('.w');
      if(!target) return;
      pressTimer=setTimeout(()=>{
        didLong=true; haptic('medium');
        const word=target.textContent.replace(/[.,;:¡!¿?"'()«»]/g,'').trim();
        if(word&&word.length>1){
          target.classList.add('pressing');
          setTimeout(()=>target.classList.remove('pressing'),400);
          openWordOrCreate(word);
        }
        pressTimer=null;
      },480);
    });
    const up=()=>clear();
    pp.addEventListener('pointerup',up);
    pp.addEventListener('pointercancel',up);
    pp.addEventListener('pointerleave',up);
    pp.addEventListener('click',()=>{
      if(didLong){ didLong=false; return; }
      const v=parseInt(pp.dataset.v,10);
      haptic('light'); openVerseSheet(bookId,chapter,v);
    });
  });

  attachSwipe($('#scroll'),()=>{ if(chapter<b.chapters) go('#/leer/'+bookId+'/'+(chapter+1)); },
                        ()=>{ if(chapter>1) go('#/leer/'+bookId+'/'+(chapter-1)); });

  const scroller=$('#scroll');
  const verseEls=Array.from(el.querySelectorAll('#verses p'));
  const onScroll=()=>{
    const max=Math.max(1,scroller.scrollHeight-scroller.clientHeight);
    const pct=scroller.scrollTop/max;
    const ring=document.querySelector('.progress-ring .fg');
    if(ring){ const r=9,c=2*Math.PI*r; ring.setAttribute('stroke-dashoffset',(c*(1-pct)).toFixed(2)); }
    const mid=scroller.scrollTop+scroller.clientHeight*0.35;
    let cur=null;
    for(const v of verseEls){ if(v.offsetTop<=mid) cur=v; else break; }
    if(cur && !cur.classList.contains('current')){
      verseEls.forEach(x=>x.classList.remove('current'));
      cur.classList.add('current');
    }
  };
  scroller.addEventListener('scroll',onScroll,{passive:true});
  onScroll();

  const targetV=route[3]?parseInt(route[3],10):(S.settings.lastRead.book===bookId&&S.settings.lastRead.chapter===chapter?S.settings.lastRead.verse:null);
  if(targetV){
    setTimeout(()=>{
      const t=$('#v'+targetV,el);
      if(t){ scroller.scrollTo({top:t.offsetTop-80,behavior:'smooth'}); t.classList.add('pulse'); setTimeout(()=>t.classList.remove('pulse'),1200); }
    },240);
  }
  renderChapterRelated(bookId,chapter);
  renderRelations(bookId,chapter);
};

function verseToSpans(text){
  return esc(text).split(/(\s+)/).map(tok=>{
    if(/^\s+$/.test(tok)) return tok;
    return '<span class="w">'+tok+'</span>';
  }).join('');
}

function attachSwipe(node,onLeft,onRight){
  let x0=null,y0=null,t0=0;
  node.addEventListener('touchstart',e=>{
    if(e.touches.length!==1) return;
    x0=e.touches[0].clientX; y0=e.touches[0].clientY; t0=Date.now();
  },{passive:true});
  node.addEventListener('touchend',e=>{
    if(x0===null) return;
    const t=e.changedTouches[0];
    const dx=t.clientX-x0,dy=t.clientY-y0,dt=Date.now()-t0;
    x0=null;
    if(dt>600) return;
    if(Math.abs(dx)<70||Math.abs(dy)>Math.abs(dx)*0.7) return;
    haptic('light');
    if(dx<0) onLeft&&onLeft(); else onRight&&onRight();
  },{passive:true});
}

async function handleVerseAction(action,bookId,chapter,verse,txt,ref){
  const vref=bookId+'.'+chapter+'.'+verse;
  switch(action){
    case 'note':{
      Layers.closeSheet();
      const n=Data.createNote({title:'',content:'<blockquote>'+esc(txt)+'</blockquote><p></p>',refs:[{book:bookId,chapter,verse}]});
      haptic('success'); go('#/nota/'+n.id); toast('Nota creada','note');
      break;
    }
    case 'study':{
      Layers.closeSheet();
      const list=S.studies.filter(s=>!s.deletedAt);
      Layers.openSheet((h,b)=>{
        h.innerHTML='<div class="h2" style="flex:1">Insertar en estudio</div><button class="icon-btn" data-close>'+ic('close')+'</button>';
        b.innerHTML='<button class="btn btn-primary btn-block" style="margin-bottom:14px" data-new>'+ic('plus')+' Nuevo estudio</button>'+
          (list.length?'<div class="list">'+list.map(s=>'<button class="row" data-s="'+s.id+'"><div class="row-ic">'+ic('layers')+'</div>'+
            '<div class="row-main"><div class="row-t">'+esc(s.title||'Estudio sin título')+'</div><div class="row-s">'+fmtDate(s.updatedAt)+'</div></div></button>').join('')+'</div>':'<p class="tiny">Todavía no tienes estudios.</p>');
        h.querySelector('[data-close]').onclick=()=>Layers.closeSheet();
        b.querySelector('[data-new]').onclick=async()=>{
          const t=await askText({title:'Nuevo estudio',label:'Título',placeholder:'Ej. La muerte al pecado'});
          if(!t) return;
          const s=Data.createStudy({title:t,blocks:[verseBlock(bookId,chapter,verse,txt)]});
          haptic('success'); Layers.closeSheet(); go('#/estudio/'+s.id); toast('Estudio creado','layers');
        };
        b.querySelectorAll('[data-s]').forEach(el=>el.onclick=()=>{
          const s=Data.getStudy(el.dataset.s);
          s.blocks=s.blocks||[];
          s.blocks.push(verseBlock(bookId,chapter,verse,txt));
          s.updatedAt=Date.now(); save('studies');
          haptic('success'); Layers.closeSheet(); toast('Versículo insertado','check');
        });
      });
      break;
    }
    case 'inbox':{
      Data.addInbox({kind:'verse',title:ref,subtitle:'Versículo guardado',book:bookId,chapter,verse,text:txt});
      haptic('success'); Layers.closeSheet(); flashSave(); toast('Guardado','inbox'); renderNav();
      break;
    }
    case 'word':{ Layers.closeSheet(); setTimeout(()=>openWordStudyFromVerse(bookId,chapter,verse,txt),120); break; }
    case 'refs':{ Layers.closeSheet(); setTimeout(()=>openCrossReferences(bookId,chapter,verse),120); break; }
    case 'link':{ Layers.closeSheet(); setTimeout(()=>openRelateDialog('verse',vref,ref),120); break; }
    case 'fav':{
      const on=Data.toggleFavorite('verse',vref,ref);
      haptic(on?'success':'light'); toast(on?'Añadido a favoritos':'Quitado','star'); Layers.closeSheet(); flashSave(); render();
      break;
    }
    case 'bm':{
      const on=Data.toggleBookmark(vref,ref,{book:bookId,chapter,verse});
      haptic(on?'success':'light'); toast(on?'Marcador guardado':'Marcador eliminado','bookmark'); Layers.closeSheet(); flashSave(); render();
      break;
    }
    case 'copy':{ await copyText('"'+txt+'" — '+ref); haptic('success'); toast('Copiado','copy'); Layers.closeSheet(); break; }
    /* =============== NATIVO 12: compartir nativo =============== */
    case 'share':{
      const payload='"'+txt+'"\n— '+ref;
      if(isNative && Cap.Share){
        try{ await Cap.Share.share({title:ref,text:payload,dialogTitle:'Compartir versículo'}); haptic('success'); }
        catch(e){}
      } else if(navigator.share){
        try{ await navigator.share({title:ref,text:payload}); haptic('success'); }catch(e){}
      } else { await copyText(payload); haptic('success'); toast('Copiado','share'); }
      Layers.closeSheet();
      break;
    }
  }

async function openWordStudyFromVerse(bookId,chapter,verse,txt){
  const words=txt.replace(/[.,;:¡!¿?"'()«»]/g,'').split(/\s+/).filter(w=>w.length>2);

function pickFromList(title,sub,items,context){
  return new Promise(resolve=>{
    Layers.openSheet((h,b)=>{
      h.innerHTML='<div style="flex:1"><div class="h2">'+esc(title)+'</div><div class="tiny">'+esc(sub)+'</div></div><button class="icon-btn" data-close>'+ic('close')+'</button>';
      b.innerHTML=(context?'<div class="sheet-quote">'+esc(context)+'</div>':'')+
        '<div class="field"><label>O escribe una expresión</label><input class="input" id="wq" placeholder="Ej. vino nuevo, gracia…"></div>'+
        '<button class="btn btn-primary btn-block" id="wok" style="margin-bottom:18px">Estudiar</button>'+
        '<div class="chip-row" style="flex-wrap:wrap;overflow:visible">'+items.map(w=>'<button class="chip chip-tap" data-w="'+esc(w)+'">'+esc(w)+'</button>').join('')+'</div>';
      const done=v=>{ Layers.closeSheet(); resolve(v); };
      h.querySelector('[data-close]').onclick=()=>done(null);
      b.querySelector('#wok').onclick=()=>done(b.querySelector('#wq').value.trim()||null);
      b.querySelectorAll('[data-w]').forEach(el=>el.onclick=()=>done(el.dataset.w));
      b.querySelector('#wq').addEventListener('keydown',e=>{ if(e.key==='Enter') done(e.target.value.trim()||null); });
    });
  });
}
function openWordOrCreate(term){
  const found=S.words.find(w=>norm(w.term)===norm(term))||S.words.find(w=>fuzzyMatch(w.term,term));
  if(found){ go('#/palabra/'+found.id); return; }

    h.innerHTML='<div class="h2" style="flex:1">Palabra no registrada</div><button class="icon-btn" data-close>'+ic('close')+'</button>';

function openWordEditor(w){
  Layers.openSheet((h,b)=>{
    h.innerHTML='<div class="h2" style="flex:1">Editar ficha</div><button class="icon-btn" data-close>'+ic('close')+'</button>';
    b.innerHTML='<div class="field"><label>Término</label><input class="input" id="f-term" value="'+esc(w.term)+'"></div>'+
      '<div class="field"><label>Transliteración / Strong</label><input class="input" id="f-strong" value="'+esc(w.strong||'')+'"></div>'+
      '<div class="field"><label>Origen</label><input class="input" id="f-origin" value="'+esc(w.origin||'')+'"></div>'+
      '<div class="field"><label>Significado</label><textarea class="textarea" id="f-meaning">'+esc(w.meaning||'')+'</textarea></div>'+
      '<div class="field"><label>Contexto</label><textarea class="textarea" id="f-context">'+esc(w.context||'')+'</textarea></div>'+
      '<div class="field"><label>Sinónimos</label><input class="input" id="f-syn" value="'+esc(w.synonyms||'')+'"></div>'+
      '<div class="field"><label>Referencias (jhn 3:16)</label><textarea class="textarea" id="f-refs">'+(w.refs||[]).map(r=>r[0]+' '+r[1]+(r[2]?':'+r[2]:'')).join('\n')+'</textarea></div>'+
      '<div style="display:flex;gap:10px"><button class="btn btn-block" data-close2>Cancelar</button><button class="btn btn-primary btn-block" id="save">Guardar</button></div>';
    h.querySelector('[data-close]').onclick=()=>Layers.closeSheet();
    b.querySelector('[data-close2]').onclick=()=>Layers.closeSheet();
    b.querySelector('#save').onclick=()=>{
      w.term=b.querySelector('#f-term').value.trim()||w.term;
      w.strong=b.querySelector('#f-strong').value.trim();
      w.origin=b.querySelector('#f-origin').value.trim();
      w.meaning=b.querySelector('#f-meaning').value.trim();
      w.context=b.querySelector('#f-context').value.trim();
      w.synonyms=b.querySelector('#f-syn').value.trim();
      w.refs=b.querySelector('#f-refs').value.split('\n').map(l=>l.trim()).filter(Boolean).map(l=>{
        const m=l.match(/^(\S+)\s+(\d+)(?::(\d+))?$/); if(!m) return null;
        const bk=bookByName(m[1]);
        return bk?[bk.id,parseInt(m[2],10),m[3]?parseInt(m[3],10):null]:null;
      }).filter(Boolean);
      save('words'); haptic('success'); Layers.closeSheet(); flashSave(); render(); toast('Ficha actualizada','check');
    };
  });
}

function blocksToHtml(blocks){
  return blocks.map(b=>b.type==='html'?b.html:b.type==='verse'?'<div class="verse-embed">'+b.html+'</div>':'').join('');
}
function buildVerseEmbed(refStr){
  const m=refStr.trim().match(/^(.+?)\s+(\d+)(?::(\d+)(?:[-–](\d+))?)?$/);
  if(!m) return null;
  const b=bookByName(m[1]); if(!b) return null;
  const ch=parseInt(m[2],10);
  const v1=m[3]?parseInt(m[3],10):null;
  const v2=m[4]?parseInt(m[4],10):v1;
  const arr=getChapter(S.settings.versionId,b.id,ch);
  if(!arr) return null;
  if(v1){
    const parts=[];
    for(let v=v1;v<=(v2||v1);v++){
      if(arr[v-1]) parts.push('<sup style="font-family:var(--font-ui);font-size:.62em;font-weight:750;color:var(--text-3);margin-right:.35em">'+v+'</sup>'+esc(arr[v-1]));
    }
    if(!parts.length) return null;
    return '<div class="verse-embed"><span class="ve-ref">'+esc(refLabel(b.id,ch,v1))+(v2&&v2!==v1?'–'+v2:'')+' · '+esc(activeVersion().abbr)+'</span>'+parts.join(' ')+'</div>';
  }
  return '<div class="verse-embed"><span class="ve-ref">'+esc(refLabel(b.id,ch))+' · '+esc(activeVersion().abbr)+'</span>'+
    arr.map((t,i)=>'<sup style="font-family:var(--font-ui);font-size:.62em;font-weight:750;color:var(--text-3);margin-right:.35em">'+(i+1)+'</sup>'+esc(t)).join(' ')+'</div>';
}

View.note=function(el,route){

    {icon:'download',title:'Exportar',onClick:()=>openExportDialog(n,'note')},

  ]});
  const rels=Data.relationsOf('note',n.id);
  el.innerHTML='<div class="page">'+
    '<div class="editor-toolbar">'+
      '<button class="tb" data-cmd="formatBlock" data-val="h2">'+ic('h2')+'</button>'+
      '<button class="tb" data-cmd="formatBlock" data-val="h3">'+ic('h3')+'</button>'+
      '<button class="tb" data-cmd="bold">'+ic('bold')+'</button>'+
      '<button class="tb" data-cmd="italic">'+ic('italic')+'</button>'+
      '<button class="tb" data-cmd="underline">'+ic('underline')+'</button>'+
      '<div class="tb-sep"></div>'+
      '<button class="tb" data-cmd="insertUnorderedList">'+ic('ul')+'</button>'+
      '<button class="tb" data-cmd="insertOrderedList">'+ic('ol')+'</button>'+
      '<button class="tb" data-cmd="formatBlock" data-val="blockquote">'+ic('quote')+'</button>'+
      '<div class="tb-sep"></div>'+
      '<button class="tb" data-ins="verse">'+ic('bookPlus')+'</button>'+
      '<button class="tb" data-ins="image">'+ic('image')+'</button>'+
      '<button class="tb" data-ins="link">'+ic('link')+'</button>'+
      '<button class="tb" data-ins="hr">'+ic('hr')+'</button>'+
    '</div>'+
    '<input id="nTitle" class="h1" style="border:0;background:none;padding:0;outline:none;width:100%;margin-bottom:6px" placeholder="Título" value="'+esc(n.title)+'">'+
    '<div class="tiny" style="margin-bottom:16px">'+((n.refs||[]).length?n.refs.map(r=>'<button class="chip chip-tap" data-ref="'+r.book+'/'+r.chapter+'/'+(r.verse||'')+'" style="margin-right:6px">'+esc(refLabel(r.book,r.chapter,r.verse))+'</button>').join(''):'')+'</div>'+
    '<div class="editor" id="nBody" contenteditable="true" data-ph="Escribe…">'+(n.content||'')+'</div>'+
    '<div class="autosave" id="autosave"><span class="dot"></span><span>Guardado automáticamente</span></div>'+
    '<div class="divider"></div>'+
    '<div class="tiny" style="display:flex;gap:16px;flex-wrap:wrap"><span>Creada '+fmtFull(n.createdAt)+'</span><span>Modificada '+fmtDate(n.updatedAt)+'</span></div>'+
    '<div class="section-head"><div class="h2">Conexiones</div><button class="link-btn" data-rel>'+ic('plus')+' Conectar</button></div>'+
    '<div id="relBox"></div><div style="height:24px"></div></div>';
  const body=$('#nBody',el);
  const title=$('#nTitle',el);
  const ind=$('#autosave',el);
  const persist=debounce(()=>{ n.content=body.innerHTML; n.updatedAt=Date.now(); save('notes'); flashSave(); ind.classList.remove('saving'); ind.classList.add('saved'); },700);
  title.addEventListener('input',()=>{
    n.title=title.value; n.updatedAt=Date.now(); ind.classList.add('saving');
    debounce(()=>{ save('notes'); flashSave(); ind.classList.remove('saving'); ind.classList.add('saved'); },500)();
  });
  body.addEventListener('input',()=>{ ind.classList.add('saving'); ind.classList.remove('saved'); persist(); });
  body.addEventListener('blur',()=>{ n.content=body.innerHTML; n.updatedAt=Date.now(); save('notes'); flashSave(); ind.classList.remove('saving'); ind.classList.add('saved'); });
  el.querySelectorAll('[data-cmd]').forEach(b=>b.onmousedown=e=>{
    e.preventDefault(); haptic('light');
    document.execCommand(b.dataset.cmd,false,b.dataset.val||null); body.focus(); persist();
  });
  el.querySelectorAll('[data-ins]').forEach(b=>b.onmousedown=async e=>{
    e.preventDefault(); body.focus();
    const k=b.dataset.ins;
    if(k==='hr'){ document.execCommand('insertHTML',false,'<hr>'); persist(); return; }
    if(k==='link'){
      const url=await askText({title:'Enlace',label:'URL'});
      if(url){ document.execCommand('createLink',false,url); persist(); } return;
    }
    if(k==='image'){
      const inp=document.createElement('input'); inp.type='file'; inp.accept='image/*';
      inp.onchange=()=>{
        const f=inp.files[0]; if(!f) return;
        const r=new FileReader();
        r.onload=()=>{ document.execCommand('insertHTML',false,'<img src="'+r.result+'" alt="">'); haptic('success'); persist(); };
        r.readAsDataURL(f);
      };
      inp.click(); return;
    }
    if(k==='verse'){
      const ref=await askText({title:'Insertar versículo',label:'Referencia',placeholder:'Romanos 6:3-5'});
      if(!ref) return;
      const html=buildVerseEmbed(ref);
      if(!html){ toast('No se encontró el pasaje','info'); return; }
      document.execCommand('insertHTML',false,html);
      const m=ref.match(/^(.+?)\s+(\d+)(?::(\d+))?/);
      if(m){
        const bk=bookByName(m[1]);
        if(bk){
          n.refs=n.refs||[];
          if(!n.refs.some(r=>r.book===bk.id&&r.chapter===+m[2])) n.refs.push({book:bk.id,chapter:+m[2],verse:m[3]?+m[3]:null});
          save('notes');
        }
      }
      haptic('success'); persist();
    }
  });
  el.querySelectorAll('[data-ref]').forEach(b=>b.onclick=()=>{
    const p=b.dataset.ref.split('/');
    go('#/leer/'+p[0]+'/'+p[1]+(p[2]?'/'+p[2]:''));
  });
  el.querySelector('[data-rel]').onclick=()=>openRelateDialog('note',n.id,n.title||'Nota');
  const box=$('#relBox',el);
  box.innerHTML=rels.length?'<div class="related-row">'+rels.map(r=>
    '<button class="rel-chip" data-r="'+r.type+':'+r.id+'">'+ic('link')+esc(r.label||r.id)+'</button>').join('')+'</div>':'<p class="tiny">Sin conexiones todavía.</p>';
  box.querySelectorAll('[data-r]').forEach(b=>{
    const p=b.dataset.r.split(':');
    b.onclick=()=>openEntity(p[0],p[1]);
  });
};
